[project]
name = "ragsody"
version = "0.1.0"
description = "Document question-answering (RAG) backend with multi-provider LLM routing."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Camilo Andrés Castellanos Herrera" }]

# Copyright (c) 2026 Camilo Andrés Castellanos Herrera

# Keep this list aligned with the imports under src/. The previous
# requirements file omitted pypdf and readability-lxml even though both
# are imported by the production ingestion path.
dependencies = [
    "openai>=1.40.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.32.0",
    "pypdf>=4.0.0",
    "readability-lxml>=0.8.0",
    "tiktoken>=0.7.0",
    "mcp>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/camilo6castell/ragsody_server"
Repository = "https://github.com/camilo6castell/ragsody_server"
Client = "https://github.com/camilo6castell/ragsody_client"
"Live demo" = "https://ragsody.vercel.app"

[project.optional-dependencies]
# Only needed when the "ollama_native" backend is used (see
# src/nlp/llm/backends/ollama_native.py). The import is lazy so that
# installs using only FastFlowLM or Gemini do not need this package.
ollama = ["ollama>=0.3.0"]
dev = [
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

# There is intentionally no [build-system] section: the project runs
# in place (`python -m src.main`, see the src/main.py docstring), not as
# a library installed with pip. Adding `pip install -e .` would require
# a build backend and a repository-wide import refactor (removing the
# "src." prefix), so it is a separate change rather than a packaging
# configuration tweak.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (errors)
    "F",   # pyflakes
    "I",   # isort (import order)
    "UP",  # pyupgrade (modern syntax for py311)
    "B",   # flake8-bugbear (common non-obvious bugs)
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.flake8-bugbear]
# B008 (function-call-in-default-argument) is a false positive for the
# FastAPI `Depends(...)` pattern: that is how FastAPI resolves
# dependencies, not a shared mutable default. Whitelist these calls so
# B008 still protects against real mutable defaults (lists/dicts)
# elsewhere in the codebase.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true


# Migrated 1:1 from mypy.ini. mypy searches for mypy.ini BEFORE
# pyproject.toml, so keeping both files would leave this block unused.
# See https://mypy.readthedocs.io/en/stable/config_file.html.
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "."
exclude = ["\\.venv"]

[[tool.mypy.overrides]]
module = [
    "sentence_transformers",
    "faiss",
    "requests",
    "requests.*",
    "bs4",
    "bs4.*",
    "readability",
    "readability.*",
    "pypdf",
    "pypdf.*",
    "ollama",
    "ollama.*",
]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
